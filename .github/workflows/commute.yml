name: Commute tracker

on:
  schedule:
    # Times are UTC; Lahore is UTC+5. The script skips runs outside its windows.
    - cron: "*/15 2-5 * * 1-5"   # 07:00-10:45 Lahore, home -> office
    - cron: "*/15 11-16 * * 1-5" # 16:00-21:45 Lahore, office -> home
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commute-tracker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Record commute time
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python commute_tracker.py poll

      - name: Commit database
        id: commit
        run: |
          if ! git add commute.db 2>/dev/null || git diff --cached --quiet; then
            echo "commute.db unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record commute times $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Rebuilds the dashboard website after every new trip (and on every manual run).
  pages:
    needs: poll
    if: needs.poll.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }} # the branch tip, including the commit just made by poll

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build dashboard
        run: |
          python commute_tracker.py dashboard
          mkdir _site
          cp commute_dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
