name: Commute tracker

on:
  schedule:
    # Every 15 minutes from 07:30 to 23:45 Lahore time, every day. Cron is in UTC
    # (Lahore is UTC+5): 02:30-02:45 and 03:00-18:45 UTC. The script also skips QUIET_HOURS.
    - cron: "30,45 2 * * *"
    - cron: "*/15 3-18 * * *"
    # Sunday 20:20 in Lahore: Google's traffic forecast for the coming week's windows.
    - cron: "20 15 * * 0"
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        options: [poll, predict]
        default: poll

permissions:
  contents: read

concurrency:
  group: commute-tracker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      COMMAND: ${{ (github.event.schedule == '20 15 * * 0' || inputs.command == 'predict') && 'predict' || 'poll' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Record commute time
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python commute_tracker.py "$COMMAND"

      - name: Commit database
        id: commit
        run: |
          if ! git add commute.db 2>/dev/null || git diff --cached --quiet; then
            echo "commute.db unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$COMMAND" = predict ]; then what="Record Google forecast"; else what="Record commute times"; fi
          git commit -m "$what $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Rebuilds the dashboard website after every new trip (and on every manual run).
  pages:
    needs: poll
    if: needs.poll.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }} # the branch tip, including the commit just made by poll

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build dashboard
        run: |
          python commute_tracker.py dashboard
          mkdir _site
          cp commute_dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
